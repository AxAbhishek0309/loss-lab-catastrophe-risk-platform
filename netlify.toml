[build]
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"

# Optional backend proxy (if hosted on Render/Railway)
[[redirects]]
  from = "/api/*"
  to = "http://127.0.0.1:8000/api/:splat"
  status = 200
  force = false

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
