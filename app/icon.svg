<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d223a" />
      <stop offset="100%" stop-color="#040c17" />
    </linearGradient>
    <linearGradient id="leftPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="centerPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="rightPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="256" height="256" rx="54" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="254" height="254" rx="53" stroke="#1d4068" stroke-width="2" />

  <!-- Mountain Peak 1 (Left) -->
  <polygon points="48,186 92,94 136,186" fill="url(#leftPeak)" opacity="0.95" />

  <!-- Mountain Peak 3 (Right) -->
  <polygon points="120,186 168,108 216,186" fill="url(#rightPeak)" opacity="0.9" />

  <!-- Center Grand Peak -->
  <polygon points="76,186 128,62 180,186" fill="url(#centerPeak)" filter="url(#glow)" />

  <!-- Actuarial Baseline -->
  <line x1="38" y1="186" x2="218" y2="186" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.85" />
</svg>